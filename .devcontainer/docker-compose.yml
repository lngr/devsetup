name: ${COMPOSE_PROJECT_NAME:-devcontainer-devsetup}

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_USER: ${HOST_USER:-vscode}
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        HOST_HOME: ${HOST_HOME:-/home/vscode}
    init: true
    privileged: true
    volumes:
      - ..:/workspaces/devsetup
      # .git mounted rw via parent volume
      - ~/.gitconfig:${HOST_HOME:-/home/vscode}/.gitconfig:cached
      - type: bind
        source: ${X11_SOCKET_DIR:-/tmp}
        target: /tmp/.X11-unix
        read_only: false
      - type: bind
        source: ${XAUTHORITY_PATH:-/dev/null}
        target: ${HOST_HOME:-/home/vscode}/.Xauthority
        read_only: true
    command: sleep infinity
    env_file:
      - path: ../.env
        required: false
      - path: ../.env.local
        required: false
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=${HOST_HOME:-/home/vscode}/.Xauthority
      - QT_X11_NO_MITSHM=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - devnet

networks:
  devnet:
    driver: bridge
